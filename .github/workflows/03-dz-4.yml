name: 03 - dz4 tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  testing_dz4:
    runs-on: ubuntu-latest
    steps:
      - name: clone repo
        uses: actions/checkout@v7

      - name: install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: run tests
        working-directory: app/project
        run: uv run -m pytest . -v
